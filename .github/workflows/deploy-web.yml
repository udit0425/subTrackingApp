name: Deploy website (EAS Hosting)

# Publishes the web version to https://subtrackerapp.expo.app on every push to main.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN  an Expo access token (expo.dev → Account settings → Access tokens)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing secret EXPO_TOKEN. See the comment at the top of deploy-web.yml."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      - name: Export web build
        run: npx expo export --platform web

      - name: Deploy to EAS Hosting (production)
        run: npx eas-cli@latest deploy --prod --non-interactive
